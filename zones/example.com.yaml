---
# zones/example.com.yaml
#
# octoDNS ゾーン設定ファイル
# ドメイン: example.com
#
# レコード名について:
#   ''  (空文字) = ゾーンの apex (@) = example.com 自体
#   www          = www.example.com
#   _dmarc       = _dmarc.example.com
#
# TTLを省略するとoctodns-config.yamlのdefault_ttl(3600)が使われる

# --- A レコード ---

# apex (example.com → IPアドレス)
'':
  type: A
  values:
    - 203.0.113.1

# www.example.com
www:
  type: A
  values:
    - 203.0.113.1

# --- MX レコード ---

'':
  type: MX
  values:
    - preference: 10
      exchange: mail.example.com.

# --- TXT レコード ---

# SPF
'':
  type: TXT
  values:
    - 'v=spf1 include:xserver.ne.jp ~all'

# DMARC
_dmarc:
  type: TXT
  ttl: 3600
  values:
    - 'v=DMARC1; p=none; rua=mailto:dmarc@example.com'

# DKIM (XServerが自動生成するCNAMEを参照する場合)
mail._domainkey:
  type: CNAME
  value: mail._domainkey.xserver.ne.jp.

# --- CNAME レコード ---

# メールサーバー向けCNAME
mail:
  type: CNAME
  value: mail.xserver.ne.jp.
